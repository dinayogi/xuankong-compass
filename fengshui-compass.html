<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>玄空羅盤｜居家分析</title>
  <style>
    :root { --ink:#0a1313; --panel:#122020; --line:#29413d; --muted:#91a6a1; --jade:#70d5c0; --gold:#e5c36f; --paper:#edf5ef; }
    *{box-sizing:border-box} body{margin:0;background:#07100f;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;letter-spacing:.02em}
    .shell{max-width:1180px;margin:0 auto;padding:28px 22px 48px;background:radial-gradient(circle at 48% -10%,#1e3932 0,#0b1514 42%,#07100f 78%);min-height:100vh}
    header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 20px}.brand{font-weight:800;font-size:18px;letter-spacing:.14em}.brand i{color:var(--gold);font-style:normal}.status{color:var(--muted);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--jade);margin-right:7px}
    h1{margin:35px 0 7px;font-size:clamp(27px,4vw,42px);letter-spacing:.04em} .intro{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.7}.intro b{color:var(--gold);font-weight:600}
    .layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:linear-gradient(145deg,rgba(22,37,35,.98),rgba(11,24,22,.98));border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px rgba(255,255,255,.025)}
    .compass-card{padding:20px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--jade);font-weight:700}.card h2{font-size:17px;margin:8px 0 18px}.compass{width:min(278px,100%);aspect-ratio:1;border-radius:50%;margin:auto;position:relative;background:repeating-conic-gradient(from -11.25deg,#25413c 0 10deg,#142a27 10deg 20deg);border:2px solid #57716a;box-shadow:0 0 0 10px #10211f,0 0 0 11px #35514a}.compass:before{content:"";position:absolute;inset:22%;border-radius:50%;background:#10211f;border:1px solid #5a766e}.compass:after{content:"";position:absolute;inset:36%;border-radius:50%;background:#edf5ef;box-shadow:0 0 0 7px #c5d8d1}.bearing{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:#122220;font-size:31px;font-weight:800;letter-spacing:-.08em}.bearing small{font-size:9px;display:block;color:#526961;letter-spacing:.12em;text-align:center;margin-top:3px}.needle{position:absolute;z-index:3;left:calc(50% - 2px);top:11%;height:39%;width:4px;background:linear-gradient(#e5c36f 0 48%,#5dc5ad 48%);transform-origin:50% 100%;transform:rotate(9deg);border-radius:4px;box-shadow:0 0 12px #e5c36f}.north{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--gold);font-weight:800}.degree{margin:23px 0 14px;display:flex;gap:9px}.degree div{flex:1;border:1px solid var(--line);padding:11px 8px;border-radius:10px;text-align:center}.degree span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.degree strong{font-size:17px}.hint{border-top:1px solid var(--line);padding-top:15px;font-size:12px;color:var(--muted);line-height:1.65}.hint b{color:var(--gold)}
    .workspace{padding:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar h2{margin:0}.pill{border:1px solid #39544e;border-radius:99px;color:var(--jade);background:#142824;padding:7px 11px;font-size:11px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.metric{padding:12px;border:1px solid var(--line);border-radius:11px}.metric span{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}.metric b{font-size:15px}.metric b.gold{color:var(--gold)}
    .grid-title{display:flex;align-items:baseline;justify-content:space-between;margin:21px 0 10px}.grid-title b{font-size:13px}.grid-title span{font-size:11px;color:var(--muted)}.nine{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #385049;border-radius:12px;overflow:hidden}.palace{min-height:126px;padding:13px;border-right:1px solid #385049;border-bottom:1px solid #385049;position:relative;background:rgba(9,20,18,.36);transition:.2s}.palace:nth-child(3n){border-right:0}.palace:nth-last-child(-n+3){border-bottom:0}.palace:hover,.palace.active{background:#17302c;box-shadow:inset 0 0 0 1px var(--gold)}.palace .num{color:var(--jade);font-size:10px}.palace h3{font-size:15px;margin:6px 0;color:#f1f7f2}.palace p{color:var(--muted);font-size:10px;line-height:1.55;margin:0}.stars{position:absolute;bottom:12px;right:12px;color:var(--gold);font-size:12px;letter-spacing:2px}.rooms{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.room{border:1px solid #355149;background:#132522;color:#b6c9c3;border-radius:99px;padding:8px 11px;font-size:11px;cursor:pointer}.room.selected{color:#1a201d;background:var(--gold);border-color:var(--gold);font-weight:700}.footer-note{font-size:11px;line-height:1.65;color:#78918a;margin:15px 0 0}
    @media(max-width:760px){.shell{padding:20px 14px}.layout{grid-template-columns:1fr}.compass{max-width:280px}.meta{grid-template-columns:repeat(3,1fr)}.palace{min-height:108px;padding:10px}.palace h3{font-size:13px}.palace p{font-size:9px}.stars{bottom:8px;right:8px}}
    @media(max-width:420px){.shell{padding:16px 10px}.brand{font-size:15px}.status{font-size:11px}h1{margin-top:25px;font-size:28px}.intro{font-size:13px}.compass-card,.workspace{padding:15px;border-radius:14px}.meta{gap:6px}.metric{padding:9px 6px}.metric b{font-size:12px}.nine{border-radius:9px}.palace{min-height:96px;padding:8px}.palace .num{font-size:8px}.palace h3{font-size:12px;margin:4px 0}.palace p{font-size:8px;line-height:1.4}.stars{font-size:9px;letter-spacing:1px}.rooms{gap:6px}.room{padding:7px 9px;font-size:10px}.footer-note{font-size:10px}}
  </style>
</head>
<body><main class="shell"><header><div class="brand"><i>玄空</i> COMPASS</div><div class="status"><span class="dot"></span>方位感測已同步</div></header>
  <h1>把你的家，放進九宮</h1><p class="intro">以座向、空間與流年為線索，整理出一張可閱讀的居家能量地圖。當前採用：<b>玄空飛星・下元九運</b></p>
  <section class="layout"><aside class="card compass-card"><div class="eyebrow">ORIENTATION</div><h2>住宅坐向</h2><div class="compass"><div class="north">N／壬子癸</div><div class="needle"></div><div class="bearing">129°<small>坐北・朝南</small></div></div><div class="degree"><div><span>坐山</span><strong>辛</strong></div><div><span>朝向</span><strong>乙</strong></div><div><span>運盤</span><strong>九運</strong></div></div><div class="hint">目前判定為 <b>巽向乾坐</b>。入戶門宜維持明亮與通風；若有室內平面圖，可再細分門、灶、床的位置。</div></aside>
  <section class="card workspace"><div class="toolbar"><div><div class="eyebrow">FLYING STAR MAP</div><h2>2026 年・宅運盤</h2></div><button class="pill" id="mode">顯示流年星</button></div><div class="meta"><div class="metric"><span>住宅格局</span><b>三房兩廳</b></div><div class="metric"><span>入戶方位</span><b class="gold">東南・巽宮</b></div><div class="metric"><span>本月重點</span><b>旺人緣</b></div></div><div class="grid-title"><b>九宮飛星佈局</b><span>點選宮位查看建議</span></div><div class="nine" id="palaces"></div><div class="grid-title"><b>配置中的空間</b><span>選取以標示對應宮位</span></div><div class="rooms" id="rooms"><button class="room selected" data-room="大門">大門</button><button class="room" data-room="客廳">客廳</button><button class="room" data-room="主臥">主臥</button><button class="room" data-room="廚房">廚房</button><button class="room" data-room="書房">書房</button><button class="room" data-room="陽台">陽台</button></div><p class="footer-note" id="note">大門位於東南巽宮，九紫喜慶星臨門：維持入口整潔、使用暖色燈光，可增添生氣與人緣。</p></section></section></main>
<script>
const palaces=[['巽｜東南','四綠','文昌、人緣','✦✦'],['離｜正南','九紫','喜慶、名望','✦✦✦'],['坤｜西南','二黑','靜養、安定','✦'],['震｜正東','三碧','行動、聲勢','✦✦'],['中宮','五黃','穩守、化煞','✦'],['兌｜正西','七赤','溝通、口舌','✦✦'],['艮｜東北','八白','財庫、累積','✦✦✦'],['坎｜正北','一白','事業、流動','✦✦'],['乾｜西北','六白','貴人、決斷','✦✦']];
const el=document.querySelector('#palaces'); let active=1;
function draw(){el.innerHTML=palaces.map((p,i)=>`<article class="palace ${i===active?'active':''}" data-i="${i}"><span class="num">${p[0]}</span><h3>${p[1]}</h3><p>${p[2]}</p><span class="stars">${p[3]}</span></article>`).join('');document.querySelectorAll('.palace').forEach(x=>x.onclick=()=>{active=+x.dataset.i;draw();document.querySelector('#note').textContent=`${palaces[active][0]}現為「${palaces[active][1]}」：適合留意 ${palaces[active][2]}；空間以整潔、柔和照明為原則。`;})}draw();
document.querySelectorAll('.room').forEach(b=>b.onclick=()=>{document.querySelectorAll('.room').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const map={大門:0,客廳:1,主臥:7,廚房:5,書房:6,陽台:2};active=map[b.dataset.room];draw();});document.querySelector('#mode').onclick=e=>{e.target.textContent=e.target.textContent==='顯示流年星'?'顯示本命星':'顯示流年星'};
</script></body></html>
